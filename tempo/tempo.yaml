# tempo.yaml

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

querier:
  query_live_store: false

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 192h  # 8 days — buffer so "Last 7 days" never hits the limit

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

metrics_generator:
  registry:
    stale_duration: 2h  # keep series alive 2h after last span — prevents gaps for hourly jobs
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces
  processor:
    local_blocks:
      filter_server_spans: false
      complete_block_timeout: 24h  # keep local blocks 24 h so traceqlMetrics panels have history
    span_metrics:
      histogram_buckets: [0.1, 0.5, 1, 2, 5, 10, 30, 60, 120, 300, 600]
      dimensions:
        - service.name
        - hangfire.job.type
        - hangfire.job.method
        - hangfire.job.attempt
        # "Dirty run" flag set by TelemetryExceptions.MarkRootDirty: the root span stayed OK
        # but an exception was recorded somewhere inside (handled per-item job errors,
        # hub-swallowed exceptions). Cardinality 2 (true/absent).
        - error.internal
      # .NET 9 built-in SignalR spans ("{HubFullTypeName}/{Method}", scope
      # Microsoft.AspNetCore.SignalR.Server) duplicate SignalRTracingHubFilter's
      # "SignalR {Hub}.{Method}" spans — both are SPAN_KIND_SERVER, so each hub
      # invocation counted twice in span metrics ("Inbound Requests" etc.).
      # Excluded from METRICS only; the span stays in the trace (it is the trace
      # root — dropping it in the collector would orphan the whole trace).
      filter_policies:
        - exclude:
            match_type: regex
            attributes:
              - key: name
                value: "^[A-Za-z0-9_.]+Hub/[A-Za-z0-9_]+$"

# Enable local-blocks for traceqlMetrics, span-metrics for Prometheus error rate / latency,
# and service-graphs for the Grafana Service Graph (traces_service_graph_* metrics; edges to
# uninstrumented peers like PostgreSQL / Kcell PBX come from CLIENT-span db.*/peer.service attrs).
overrides:
  defaults:
    metrics_generator:
      processors: [local-blocks, span-metrics, service-graphs]
    global:
      # Default 5 MB drops long chatty jobs (CreatePenyaJob: 234 s, >5.6k spans discarded
      # as trace_too_large — trace vanished while span metrics still counted the run).
      # 20 MB gives ~4x headroom; watch tempo_discarded_spans_total{reason="trace_too_large"}.
      max_bytes_per_trace: 20971520

query_frontend:
  search:
    duration_slo: 5s
  metrics:
    max_duration: 192h  # 8 days — buffer so "Last 7 days" never hits the limit

usage_report:
  reporting_enabled: false
