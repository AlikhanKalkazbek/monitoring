# tempo.yaml

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

querier:
  query_live_store: false

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 192h  # 8 days — buffer so "Last 7 days" never hits the limit

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

metrics_generator:
  registry:
    stale_duration: 2h  # keep series alive 2h after last span — prevents gaps for hourly jobs
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces
  processor:
    local_blocks:
      filter_server_spans: false
      complete_block_timeout: 24h  # keep local blocks 24 h so traceqlMetrics panels have history
    span_metrics:
      histogram_buckets: [0.1, 0.5, 1, 2, 5, 10, 30, 60, 120, 300, 600]
      dimensions:
        - service.name
        - hangfire.job.attempt

# Enable local-blocks for traceqlMetrics and span-metrics for Prometheus error rate / latency
overrides:
  defaults:
    metrics_generator:
      processors: [local-blocks, span-metrics]

query_frontend:
  search:
    duration_slo: 5s
  metrics:
    max_duration: 192h  # 8 days — buffer so "Last 7 days" never hits the limit

usage_report:
  reporting_enabled: false
